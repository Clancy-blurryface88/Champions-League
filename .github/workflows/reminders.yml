# Backup trigger for the "go predict" reminder pushes (api/_reminders.js).
# The main trigger is the Supabase pg_cron job "prediction-reminders" (every
# 5 min) — GitHub's scheduled runs get delayed by hours, so they can't be
# relied on. The endpoint decides what's due and dedupes, so extra runs are
# harmless.
name: Prediction reminders

on:
  schedule:
    - cron: "*/10 7-21 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: curl -fsS --max-time 60 "https://champions-league-2026.vercel.app/api/football?source=reminders"
