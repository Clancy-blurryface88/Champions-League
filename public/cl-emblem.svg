<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Champions League emblem">
  <defs>
    <radialGradient id="bg" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="55%" stop-color="#0d2a6e"/>
      <stop offset="100%" stop-color="#050b1f"/>
    </radialGradient>
    <linearGradient id="star" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#dbe6ff"/>
      <stop offset="100%" stop-color="#9db4e8"/>
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c7d4f5"/>
      <stop offset="100%" stop-color="#5678c9"/>
    </linearGradient>
  </defs>

  <circle cx="256" cy="256" r="248" fill="url(#bg)" stroke="url(#ring)" stroke-width="8"/>

  <!-- Eight-pointed star badge -->
  <g transform="translate(256,256)">
    <path d="M0,-170 L34,-70 L136,-100 L58,-28 L150,20 L46,10 L64,112 L0,32 L-64,112 L-46,10 L-150,20 L-58,-28 L-136,-100 L-34,-70 Z"
          fill="url(#star)" stroke="#f5f8ff" stroke-width="3" stroke-linejoin="round"/>
    <circle r="30" fill="#0d2a6e" stroke="url(#star)" stroke-width="4"/>
  </g>

  <!-- subtle ring accents -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#7fa0e8" stroke-opacity="0.35" stroke-width="2"/>
</svg>
