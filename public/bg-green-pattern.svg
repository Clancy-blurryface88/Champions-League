<svg width="120" height="120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="s1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="rgba(0,0,0,0.28)"/>
    </filter>
    <filter id="s2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="3" stdDeviation="3" flood-color="rgba(0,0,0,0.22)"/>
    </filter>
    <filter id="s3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="rgba(0,0,0,0.3)"/>
    </filter>
  </defs>

  <!-- Base background -->
  <rect width="120" height="120" fill="#2a9958"/>

  <!-- Top-left raised block -->
  <rect x="4" y="4" width="54" height="54" rx="13" fill="#52c97a" filter="url(#s1)"/>

  <!-- Top-right C-shape (rounded on left side only) -->
  <rect x="62" y="4" width="54" height="54" rx="13" fill="#3db868" filter="url(#s2)"/>

  <!-- Bottom-left C-shape -->
  <rect x="4" y="62" width="54" height="54" rx="13" fill="#3db868" filter="url(#s2)"/>

  <!-- Bottom-right raised block -->
  <rect x="62" y="62" width="54" height="54" rx="13" fill="#52c97a" filter="url(#s1)"/>

  <!-- Inner corner cutouts — simulate C bracket feel -->
  <rect x="42" y="42" width="36" height="36" rx="8" fill="#2a9958"/>
  <rect x="42" y="0" width="36" height="36" rx="8" fill="#2a9958"/>
  <rect x="0" y="42" width="36" height="36" rx="8" fill="#2a9958"/>
  <rect x="84" y="42" width="36" height="36" rx="8" fill="#2a9958"/>
  <rect x="42" y="84" width="36" height="36" rx="8" fill="#2a9958"/>

  <!-- Small highlight dots at intersections -->
  <circle cx="60" cy="60" r="5" fill="#1e7d44" opacity="0.6"/>
</svg>
